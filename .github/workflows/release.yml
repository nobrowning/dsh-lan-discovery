name: Publish installable plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64, platform: linux, architecture: x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64, platform: linux, architecture: arm64 }
          - { os: windows-latest, target: windows-x64, platform: win32, architecture: x64 }
          - { os: macos-15, target: macos-arm64, platform: darwin, architecture: arm64 }
          - { os: macos-15-intel, target: macos-x64, platform: darwin, architecture: x64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: ${{ matrix.architecture }}
          cache: npm
      - name: Verify runtime target
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: node -e 'if (process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCHITECTURE) throw new Error("Unexpected runner target"); console.log(JSON.stringify({platform:process.platform, architecture:process.arch, node:process.version}));'
      - name: Match tag to package version
        shell: bash
        run: node -e 'const p = require("./package.json"); if (process.env.RELEASE_TAG !== "v" + p.version) throw new Error("Tag must match package version");'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Pack and verify clean offline installation
        shell: bash
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          npm run verify:release -- dist/dsh-lan-discovery-*.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: release-package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-package-linux-x64
          path: dist
      - name: Prepare draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$existing" = "false" ]; then
            echo "Release already exists; preserving its published assets."
          elif [ "$existing" = "true" ]; then
            gh release upload "$RELEASE_TAG" dist/*.tgz dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.tgz dist/SHA256SUMS --draft --verify-tag --title "LAN discovery $RELEASE_TAG" --generate-notes --notes "One portable .tgz package for the verified Node targets. Harness integration requires the pinned rc.3/rc.5 Host interfaces; package CI does not qualify a Desktop or Web installation. See README and docs/platform-support.md for platform-specific installation commands, current acceptance evidence, and trust configuration."
          fi
